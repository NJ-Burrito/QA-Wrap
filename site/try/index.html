<body data-lang="en">
<main id="main" class="try">
  <h1>Practice page</h1>
  <p>Wake QA Wrap on this tab, press Start, fill in the form, press Save changes, then Stop and open the report. It should name the click and the failed request.</p>
  <p class="fine" id="fine">Changes are saved to your profile within a few seconds.</p>
  <form id="f">
    <label for="n">Display name</label>
    <input id="n" name="n" autocomplete="off" value="Sam Tester">
    <button type="submit" id="save">Save changes</button>
  </form>
  <p id="status" role="status"></p>
  <p>Nothing you type here is stored or sent anywhere.</p>
</main>
<script>
(function () {
  var status = document.getElementById('status');
  var ready = 'serviceWorker' in navigator
    ? navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; })
    : Promise.resolve();
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = 'Saving…';
    ready.catch(function () {}).then(function () {
      return fetch('save', { method: 'POST', body: JSON.stringify({ name: document.getElementById('n').value }) });
    }).then(function (r) {
      if (!r.ok) throw new Error('Save failed: HTTP ' + r.status); // planted fault 1 (a 500) and 2 (console.error)
      status.textContent = 'Saved.';
    }).catch(function (err) {
      console.error(err.message);
      status.textContent = 'Could not save. Try again.';
    });
  });
})();
</script>
