<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta id="qawRun" name="qaw-run" content="__QAW_RUN__">
<title>Bug Hunt - QA Wrap</title>
<link rel="icon" href="/brand/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/game.css">
<link rel="stylesheet" href="/shop.css">
</head>
<body data-screen="title">

<!-- Icon sprite: drawn for this project, 24 grid, 1.5 stroke. Bug and star glyphs are never mirrored. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-mark" viewBox="0 0 64 64"><g transform="translate(-2 1)" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M45.01 37.98 A17 17 0 1 0 34.97 46.26" stroke="currentColor"/><path d="M36 36L42.5 44L55 20" stroke="var(--mark-check, #B5432B)"/></g></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.6 6.8a7.5 7.5 0 0 1 0 10.4"/></g></symbol>
    <symbol id="i-speaker-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l4.5 5M21 9.5l-4.5 5"/></g></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></g></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></g></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></g></symbol>
    <symbol id="i-bug" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="14" rx="4.5" ry="6"/><path d="M9 8.2a3 3 0 0 1 6 0"/><path d="M12 9v11M7.5 12.5H3.5M16.5 12.5h4M7.7 16.5H4.5M16.3 16.5h3.2M8.6 18.8L6 21M15.4 18.8L18 21M10 5.6L8.2 3.4M14 5.6l1.8-2.2"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.1l-5.4 3 1-6.1-4.4-4.3 6.1-.9z" style="fill:var(--star-fill,none)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 6.5L18.5 12 13 17.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <!-- QA Wrap icons, copied from extension/ui/icons.js (UQAIcons): awake, copy, event-console, event-request, key, note, shape-circle, stop, tag-bug, timeline, tool-shot -->
    <symbol id="qi-awake" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-4.3 5.2-6.5 9-6.5s7 2.2 9 6.5c-2 4.3-5.2 6.5-9 6.5S5 16.3 3 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></g></symbol>
    <symbol id="qi-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="10" width="11" height="11" rx="2"/><path d="M6.5 14H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1.5"/></g></symbol>
    <symbol id="qi-event-console" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></g></symbol>
    <symbol id="qi-event-request" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19V5M4.5 8.5 8 5l3.5 3.5M16 5v14M12.5 15.5 16 19l3.5-3.5"/></g></symbol>
    <symbol id="qi-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="16" r="4"/><path d="M10.83 13.17 19 5M16 8l2.5 2.5M13.5 10.5l2 2"/></g></symbol>
    <symbol id="qi-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14V7a3 3 0 0 0-3-3H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h7z"/><path d="M14 20v-3a3 3 0 0 1 3-3h3M8 9h8M8 13h4"/></g></symbol>
    <symbol id="qi-shape-circle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></g></symbol>
    <symbol id="qi-stop" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/></g></symbol>
    <symbol id="qi-tag-bug" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.69 6.88A1.5 1.5 0 0 1 13.31 6.88L18.77 16.78A1.5 1.5 0 0 1 17.46 19L6.54 19A1.5 1.5 0 0 1 5.23 16.78Z" fill="currentColor"/></g></symbol>
    <symbol id="qi-timeline" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12H16"/><circle cx="18.5" cy="12" r="2.5"/><path d="M4.5 10l2 2-2 2-2-2zM11 10l2 2-2 2-2-2z" fill="currentColor" stroke-width="1"/></g></symbol>
    <symbol id="qi-tool-shot" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/><path d="M12 10l2 2-2 2-2-2z" fill="currentColor" stroke-width="1"/></g></symbol>
  </defs>
</svg>

<header class="hud" id="hud">
  <div class="hud-start">
    <svg class="mark" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><use href="#i-mark"/></svg>
    <span class="brand" data-i18n="app.brand"></span>
    <ol class="pips" id="pips" data-i18n-aria="hud.progress">
      <li class="pip"></li><li class="pip"></li><li class="pip"></li><li class="pip"></li><li class="pip"></li>
    </ol>
    <span class="hud-level" id="hudLevel"></span>
  </div>
  <div class="hud-end">
    <div class="seg" id="langSeg" role="group" data-i18n-aria="lang.aria">
      <button type="button" class="seg-btn" data-lang="en" data-i18n="lang.en"></button>
      <button type="button" class="seg-btn" data-lang="ar" data-i18n="lang.ar"></button>
    </div>
    <button type="button" class="icon-btn" id="btnTheme" data-i18n-aria="theme.aria"><svg width="22" height="22" aria-hidden="true"><use href="#i-contrast"/></svg></button>
    <div class="score-box" id="scoreBox" data-live>
      <span class="score-lbl" data-i18n="hud.score"></span>
      <output class="score-val" id="score">0</output>
    </div>
    <span class="chain" id="chainPill" aria-hidden="true"><span class="chain-glow"></span><span class="chain-txt" id="chainTxt"></span></span>
    <button type="button" class="icon-btn" id="btnPause" data-i18n-aria="hud.pause"><svg width="22" height="22" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <button type="button" class="icon-btn" id="btnSound" data-i18n-aria="hud.sound" aria-pressed="false"><svg width="22" height="22" aria-hidden="true"><use href="#i-speaker-off" id="soundUse"/></svg></button>
    <button type="button" class="icon-btn" id="btnSettings" data-i18n-aria="hud.settings"><svg width="22" height="22" aria-hidden="true"><use href="#i-sliders"/></svg></button>
  </div>
</header>

<main id="main">

  <!-- TITLE -->
  <section class="screen" id="screen-title" data-screen-name="title">
    <div class="title-copy">
      <div class="mark-tile" aria-hidden="true"><img id="titleMark" src="/brand/mark-motion.svg" width="64" height="64" alt=""></div>
      <h1 class="display" id="titleName" data-i18n="app.name"></h1>
      <p class="lead" data-i18n="title.lead"></p>
      <p class="sub" data-i18n="title.sub"></p>
      <div class="actions">
        <button type="button" class="btn btn-lg" id="btnStart" data-prim-cand><span data-i18n="title.start"></span><span class="btn-ico" aria-hidden="true"><svg width="18" height="18"><use href="#i-arrow"/></svg></span></button>
        <button type="button" class="link" id="btnSkipIntro" data-i18n="title.skipIntro"></button>
      </div>
      <div class="sticker-row">
        <span class="micro" data-i18n="title.stickers"></span>
        <ul class="stickers" id="stickerRow"></ul>
        <span class="micro" id="bestLine" data-live></span>
      </div>
    </div>
    <div class="title-art" aria-hidden="true">
      <div class="tray"><div class="tray-core" id="titleArt"></div></div>
    </div>
  </section>

  <!-- LEVEL CARD -->
  <section class="screen" id="screen-card" data-screen-name="card" hidden>
    <div class="tray card-tray"><div class="tray-core card-core">
      <p class="card-level" id="cardLevel"></p>
      <div class="card-feature" id="cardFeature"></div>
      <h2 class="card-goal" id="cardGoal" tabindex="-1"></h2>
      <p class="card-look" id="cardLook"></p>
      <div class="actions">
        <button type="button" class="btn btn-lg" id="btnGo" data-prim-cand><span data-i18n="card.go"></span><span class="btn-ico" aria-hidden="true"><svg width="18" height="18"><use href="#i-arrow"/></svg></span></button>
        <button type="button" class="link" id="btnCardSkip" data-i18n="card.skip"></button>
      </div>
    </div></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="screen-play" data-screen-name="play" hidden>
    <div class="stage">
      <div class="stage-frame"><div class="tray"><div id="app" class="app-root"></div></div></div>
      <div class="qaw-line" id="qawLine" data-live>
        <span class="qaw-name" data-i18n="qaw.label"></span>
        <span class="qaw-chip" id="qawChip"></span>
        <span class="qaw-count" id="qawNotes"></span>
        <span class="qaw-count" id="qawShots"></span>
      </div>
    </div>
    <aside class="rail" id="rail">
      <div class="rail-card">
        <h2 class="rail-title" data-i18n="rail.goal"></h2>
        <p class="rail-goal" id="railGoal"></p>
        <ul class="rail-flags">
          <li class="flag" id="flagBug"><svg width="20" height="20" aria-hidden="true"><use href="#i-bug"/></svg><span id="flagBugTxt"></span></li>
          <li class="flag flag-hidden" id="flagHidden"><span class="flag-q" aria-hidden="true">?</span><span id="flagHiddenTxt"></span></li>
        </ul>
        <div class="rail-proof" id="railProof"></div>
        <p class="rail-needs" id="railNeeds"></p>
      </div>
      <div class="slot-note" id="slotNote" role="status" aria-live="polite"></div>
      <div class="slot-bug" id="slotBug" aria-live="polite"></div>
      <div class="rail-actions">
        <button type="button" class="link" id="btnSkip" data-i18n="rail.skip"></button>
        <button type="button" class="btn btn-lg" id="btnPrimary" data-prim-cand><span id="btnPrimaryTxt"></span><span class="btn-ico" aria-hidden="true"><svg width="18" height="18"><use href="#i-arrow"/></svg></span></button>
      </div>
    </aside>
  </section>

  <!-- FINALE -->
  <section class="screen" id="screen-finale" data-screen-name="finale" hidden>
    <div class="finale-top">
      <h2 class="finale-title" id="finaleTitle" tabindex="-1" data-i18n="finale.title"></h2>
      <div class="finale-stats" data-live><span><span data-i18n="finale.score"></span> <b id="finScore">0</b></span><span id="finStars"></span></div>
    </div>
    <div class="finale-grid">
      <div class="tray"><div class="tray-core paste-core">
        <label class="paste-label" for="pasteBox" data-i18n="finale.pasteLabel"></label>
        <textarea id="pasteBox" rows="4" spellcheck="false" autocomplete="off"></textarea>
        <p class="micro" data-i18n="finale.pasteNote"></p>
        <div class="paste-result" id="pasteResult" role="status" aria-live="polite"></div>
        <h3 class="check-title" data-i18n="finale.featuresTitle"></h3>
        <ul class="checklist" id="finChecklist"></ul>
      </div></div>
      <div class="tray"><div class="tray-core result-core">
        <p class="found" id="finFound"></p>
        <p class="micro" data-i18n="finale.send"></p>
        <div class="board" id="finBoard"></div>
        <div class="actions">
          <button type="button" class="btn btn-lg" id="btnCopyScore" data-prim-cand><span id="btnCopyScoreTxt" data-i18n="finale.copyScore"></span><span class="btn-ico" aria-hidden="true"><svg width="18" height="18"><use href="#qi-copy"/></svg></span></button>
          <button type="button" class="link" id="btnAgain" data-i18n="finale.again"></button>
        </div>
        <p class="micro" data-i18n="finale.resetNote"></p>
      </div></div>
    </div>
  </section>

</main>

<div class="caption" id="caption" role="status" aria-live="polite" data-i18n-aria="caption.region"><p class="caption-text" id="captionText"></p></div>

<!-- LEVEL CLEAR (dialog) -->
<div class="overlay overlay-clear" id="ov-clear" hidden>
  <div class="tray dialog-tray"><div class="tray-core dialog" role="dialog" aria-modal="true" aria-labelledby="clearTitle" id="dlgClear">
    <h2 class="dialog-title" id="clearTitle" tabindex="-1"></h2>
    <div class="stars" id="clearStars" role="img"></div>
    <div class="dialog-body">
      <dl class="facts">
        <div><dt data-i18n="clear.caught"></dt><dd id="clCaught"></dd></div>
        <div><dt data-i18n="clear.proved"></dt><dd id="clProved"></dd></div>
        <div><dt data-i18n="clear.hidden"></dt><dd id="clHidden"></dd></div>
        <div><dt data-i18n="clear.time"></dt><dd id="clTime"></dd></div>
        <div><dt data-i18n="clear.best"></dt><dd id="clBest"></dd></div>
        <div><dt data-i18n="clear.score"></dt><dd id="clScore"></dd></div>
      </dl>
      <p class="clear-sticker" id="clSticker"></p>
      <p class="clear-learned" id="clLearned"></p>
      <div class="board" id="clBoard"></div>
      <p class="micro" id="clNote"></p>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-lg" id="btnNext" data-prim-cand><span id="btnNextTxt"></span><span class="btn-ico" aria-hidden="true"><svg width="18" height="18"><use href="#i-arrow"/></svg></span></button>
    </div>
  </div></div>
</div>

<!-- SETTINGS (sheet) -->
<div class="overlay" id="ov-settings" hidden>
  <div class="tray dialog-tray"><div class="tray-core dialog" role="dialog" aria-modal="true" aria-labelledby="setTitle" id="dlgSettings">
    <div class="dialog-head">
      <h2 class="dialog-title sm" id="setTitle" tabindex="-1" data-i18n="set.title"></h2>
      <button type="button" class="icon-btn" id="btnSetClose" data-i18n-aria="set.close"><svg width="22" height="22" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="dialog-body">
      <div class="set-row"><span class="set-lbl" data-i18n="set.lang"></span>
        <div class="seg" role="group" data-i18n-aria="lang.aria"><button type="button" class="seg-btn" data-lang="en" data-i18n="lang.en"></button><button type="button" class="seg-btn" data-lang="ar" data-i18n="lang.ar"></button></div></div>
      <div class="set-row"><span class="set-lbl" data-i18n="set.theme"></span>
        <div class="seg" role="group" data-i18n-aria="set.theme"><button type="button" class="seg-btn" data-theme-set="auto" data-i18n="set.themeAuto"></button><button type="button" class="seg-btn" data-theme-set="light" data-i18n="set.themeLight"></button><button type="button" class="seg-btn" data-theme-set="dark" data-i18n="set.themeDark"></button></div></div>
      <div class="set-row"><span class="set-lbl" data-i18n="set.sound"></span>
        <button type="button" class="switch" id="swSound" role="switch" aria-checked="false"><span class="switch-knob"></span><span class="switch-txt"></span></button>
        <label class="vol"><span class="sr" data-i18n="set.volume"></span><input type="range" id="rngVolume" min="0" max="100" step="5"><output id="volOut"></output></label></div>
      <div class="set-row"><span class="set-lbl" data-i18n="set.voice"></span>
        <button type="button" class="switch" id="swVoice" role="switch" aria-checked="false"><span class="switch-knob"></span><span class="switch-txt"></span></button></div>
      <div class="set-row"><span class="set-lbl"><span data-i18n="set.calm"></span><span class="micro block" data-i18n="set.calmNote"></span></span>
        <button type="button" class="switch" id="swCalm" role="switch" aria-checked="false"><span class="switch-knob"></span><span class="switch-txt"></span></button></div>
      <div class="set-row set-best"><span class="set-lbl" data-i18n="set.best"></span><span class="best-list" id="bestList" data-live></span></div>
      <div class="set-row"><button type="button" class="link danger" id="btnReset" data-i18n="set.reset"></button></div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-lg" id="btnSetDone" data-prim-cand><span data-i18n="set.done"></span></button>
    </div>
  </div></div>
</div>

<!-- PAUSE -->
<div class="overlay overlay-pause" id="ov-pause" hidden>
  <div class="pause-core" role="dialog" aria-modal="true" aria-labelledby="pauseText">
    <p class="pause-text" id="pauseText" data-i18n="pause.text"></p>
    <button type="button" class="btn btn-lg" id="btnResume" data-prim-cand><span data-i18n="pause.resume"></span></button>
  </div>
</div>

<div class="narrow" id="narrow" role="alert"><p data-i18n="err.wide"></p></div>
<div class="fatal" id="fatal" role="alert" hidden><p id="fatalTxt"></p></div>
<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<script type="module" src="/game.js"></script>
</body>
</html>
