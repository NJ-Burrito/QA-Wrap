# Pushing a tag v<major.minor.patch> publishes the GitHub release the in-extension update check looks for (core/update-source.json).
# Notes come from CHANGELOG.md by script (extension/tools/release-notes.mjs, no model); the one release zip qa-wrap-<version>.zip (npm run release:zip) is attached. The repo is private for now; the in-extension check works with an optional read-only token (Settings).
# A tag whose version differs from manifest.json, or with no CHANGELOG section, stops the run before anything is published.
# No model writes anything here: notes are cut from CHANGELOG.md by script and the checksum is sha256sum. GitHub Releases over HTTPS is the only host.
# Actions are pinned by commit SHA like ci.yml.
name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extension
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts
      - name: The tag matches manifest.json
        run: test "v$(node -p "require('./manifest.json').version")" = "$TAG"
      - name: Release notes from CHANGELOG.md
        run: node tools/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Build dist/chrome and zip it as qa-wrap-<version>.zip
        run: QAW_DIST="$RUNNER_TEMP/dist" npm run release:zip
      - name: SHA-256 of the zip, published beside it (the updater and the installers verify against it)
        run: cd "$RUNNER_TEMP/dist" && sha256sum "qa-wrap-${TAG#v}.zip" > "qa-wrap-${TAG#v}.zip.sha256"
      - name: Create the release
        run: gh release create "$TAG" "$RUNNER_TEMP/dist/qa-wrap-${TAG#v}.zip" "$RUNNER_TEMP/dist/qa-wrap-${TAG#v}.zip.sha256" --title "QA Wrap ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
