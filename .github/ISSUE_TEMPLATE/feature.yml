name: "Feature"
description: "Propose a change to QA-Wrap"
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Recording"
        - "Timeline"
        - "Bug report / export"
        - "Jira"
        - "Settings"
        - "Website"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What gets in your way today."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposal"
      description: "What you would like instead."
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: "How we would know it works"
      description: "Optional: a test, a check or a before/after."
