<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=640" />
<title>QA Wrap banner (animated, 7 s loop)</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face{font-family:"Thmanyah Sans";src:url("./assets/fonts/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Thmanyah Sans";src:url("./assets/fonts/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Thmanyah Sans";src:url("./assets/fonts/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Thmanyah Serif Display";src:url("./assets/fonts/thmanyahserifdisplay-Black.woff2") format("woff2");font-weight:900;font-display:block}
/* QA Wrap dark tokens (identity/tokens/tokens.css): basalt ground, limestone ink, corn highlight, pass/fail dark values. */
:root{--ground:#1D2024;--ground2:#262B30;--raise:#2C3238;--ink:#F1EFE9;--muted:#B4B0A6;--corn:#E2AE38;--tortilla:#D8C6A4;--pass:#7ED08A;--fail:#FF9270;--line:rgba(241,239,233,.16);
 --sans:"Thmanyah Sans",sans-serif;--serif:"Thmanyah Serif Display",serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--ground)}
#stage{position:relative;width:1280px;height:640px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--sans)}
.abs{position:absolute}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* depth: sandstone strata behind everything, light behind the ring */
.strata{position:absolute;border-radius:60px;background:linear-gradient(135deg,rgba(216,198,164,.075),rgba(216,198,164,.015))}
#glow{left:600px;top:130px;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,rgba(226,174,56,.30),rgba(226,174,56,.08) 60%,transparent);opacity:.55}
#lockup{left:64px;top:44px;width:208px}
h1{position:absolute;left:64px;top:120px;font-family:var(--serif);font-weight:900;font-size:66px;line-height:1.1;letter-spacing:-.5px;white-space:nowrap}
h1 em{font-style:normal;color:var(--corn);position:relative}
#ul{position:absolute;left:0;bottom:-6px;width:100%;height:6px;border-radius:3px;background:var(--corn);transform-origin:0 50%}
#pills{position:absolute;left:64px;top:300px;display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 12px;border-radius:23px;font-weight:700;font-size:21px;border:2px solid var(--line);color:var(--muted);background:transparent}
.pill .i{width:22px;height:22px}
.pill .ck{position:relative;width:22px;height:22px}
.pill .ck svg{position:absolute;inset:0}
.arrow{width:18px;height:18px;color:var(--muted);opacity:.7}
#tag{left:64px;top:392px;width:560px;font-size:27px;line-height:1.35;font-weight:500;color:var(--ink)}
#tag b{color:var(--corn);font-weight:700}
#lock{left:64px;top:490px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:20px;font-weight:500}
/* scene */
#ring{left:680px;top:210px;width:180px;height:180px;overflow:visible}
.chip{position:absolute;left:925px;width:236px;height:58px;border-radius:15px;background:var(--raise);border:2px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;font-weight:700;font-size:20px;white-space:nowrap;box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:0}
.chip svg.i{width:26px;height:26px}
#card{left:880px;top:100px;width:352px;height:440px;border-radius:24px;background:var(--ground2);border:2px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.3);overflow:hidden;transform-origin:0 50%}
#card .hd{position:absolute;left:20px;top:16px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:21px;color:var(--tortilla)}
#ttl{position:absolute;left:20px;top:52px;font-weight:700;font-size:24px;white-space:nowrap}
#ttlw{position:absolute;left:0;top:0;width:352px;height:40px;overflow:hidden}
.row{position:absolute;left:20px;width:312px;height:54px;border-radius:12px;background:var(--raise);display:flex;align-items:center;gap:12px;padding:0 14px}
.row .t{display:flex;flex-direction:column;line-height:1.15;font-weight:700;font-size:18px}
.row .s{font-size:13px;font-weight:500;color:var(--muted)}
.row .tg{margin-left:auto;font-size:14px;font-weight:700;padding:3px 9px;border-radius:9px}
.bar{position:absolute;left:20px;height:10px;border-radius:5px;background:rgba(241,239,233,.22);transform-origin:0 50%}
#btn{position:absolute;left:20px;top:366px;width:312px;height:52px;border-radius:14px;background:var(--corn);color:#1D2024;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700;font-size:21px}
#link{position:absolute;left:8px;top:131px;width:6px;height:60px;border-radius:3px;background:var(--corn);transform-origin:50% 0}
#sheen{position:absolute;top:-20px;left:-200px;width:120px;height:500px;transform:rotate(14deg);background:linear-gradient(90deg,transparent,rgba(241,239,233,.13),transparent)}
</style>
</head>
<body>
<div id="stage" data-composition-id="qaw-banner" data-start="0" data-duration="7" data-fps="25" data-width="1280" data-height="640">

  <div class="strata s1" style="left:520px;top:-120px;width:620px;height:300px;transform:rotate(-12deg)"></div>
  <div class="strata s2" style="left:600px;top:420px;width:760px;height:260px;transform:rotate(-9deg)"></div>
  <div id="glow" class="abs"></div>

  <img id="lockup" class="abs" src="./assets/logo/qa-wrap-lockup-dark.svg" alt="QA Wrap" />
  <h1>Test the page.<br>Get the <em>bug report.<span id="ul"></span></em></h1>

  <div id="pills">
    <div class="pill" id="p1"><span class="ck"><svg class="i ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><circle cx="12" cy="12" r="9"/></svg><svg class="i ok" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>Record</div>
    <svg class="i arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <div class="pill" id="p2"><span class="ck"><svg class="i ic" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><svg class="i ok" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>Link</div>
    <svg class="i arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <div class="pill" id="p3"><span class="ck"><svg class="i ic" viewBox="0 0 24 24"><path d="M10.5 21H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h6l5 5v3M14 3v5h5M8 9h3M8 13h5"/></svg><svg class="i ok" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>Write</div>
  </div>

  <div id="tag" class="abs">Nothing leaves your computer until you <b>press a button</b>.</div>

  <!-- the mark: open ring + check (identity/logo/mark-dark.svg geometry) -->
  <svg id="ring" class="abs" viewBox="0 0 64 64" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2 1)">
      <path id="ringp" stroke="#ECEAE3" d="M45.01 37.98 A17 17 0 1 0 34.97 46.26"/>
      <path id="chk" stroke="#FF8A6E" d="M36 36L42.5 44L55 20" pathLength="1" stroke-dasharray="1 1"/>
    </g>
  </svg>

  <div class="chip" id="c1" style="top:141px"><svg class="i" viewBox="0 0 24 24" style="color:var(--ink)"><path d="M5.5 4.5l5 14 2.2-5.8 5.8-2.2z"/></svg>Click Pay</div>
  <div class="chip" id="c2" style="top:271px"><svg class="i" viewBox="0 0 24 24" style="color:var(--fail)"><path d="M8 19V5M4.5 8.5 8 5l3.5 3.5M16 5v14M12.5 15.5 16 19l3.5-3.5"/></svg>POST /order 500</div>
  <div class="chip" id="c3" style="top:401px"><svg class="i" viewBox="0 0 24 24" style="color:var(--fail)"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>TypeError</div>

  <div id="card" class="abs">
    <div class="hd"><svg class="i" viewBox="0 0 24 24"><g transform="translate(-1 0)"><path d="M10.5 21H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h6l5 5v3M14 3v5h5"/><path d="M8 9h3M8 13h5"/><path d="M14 18l2 2 5-5"/></g></svg>Bug report</div>
    <div id="ttl"><div id="ttlw"><span id="ttlt">Pay fails with a 500</span></div></div>
    <div class="row" id="r1" style="top:104px"><svg class="i" viewBox="0 0 24 24"><path d="M5.5 4.5l5 14 2.2-5.8 5.8-2.2z"/></svg><div class="t">Click Pay<span class="s">step 1</span></div></div>
    <div class="row" id="r2" style="top:164px"><svg class="i" viewBox="0 0 24 24" style="color:var(--fail)"><path d="M8 19V5M4.5 8.5 8 5l3.5 3.5M16 5v14M12.5 15.5 16 19l3.5-3.5"/></svg><div class="t">POST /order<span class="s" id="r2s">caused by Click Pay</span></div><span class="tg" style="background:rgba(255,146,112,.12);color:#FFB09A">FAIL</span></div>
    <div class="row" id="r3" style="top:224px"><svg class="i" viewBox="0 0 24 24" style="color:var(--fail)"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M13 15h4"/></svg><div class="t">TypeError<span class="s">console</span></div><span class="tg" style="background:rgba(255,146,112,.12);color:#FFB09A">FAIL</span></div>
    <div id="link"></div>
    <div class="bar" id="b1" style="top:302px;width:300px"></div>
    <div class="bar" id="b2" style="top:324px;width:210px"></div>
    <div id="btn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11 12 15.5 16.5 11M5 20h14"/></svg>Export report</div>
    <div id="sheen" data-layout-allow-overflow></div>
  </div>
</div>

<script>
(() => {
  const ID = "qaw-banner", D = 7;
  gsap.registerPlugin && 0;
  const tl = gsap.timeline({ paused: true });
  const _f = tl.fromTo.bind(tl); tl.fromTo = (t, a, b, p) => _f(t, a, { ...b, immediateRender: false }, p); // base state = finished poster at t=0
  const q = (s) => document.querySelector(s);
  const pills = ["#p1", "#p2", "#p3"];
  const IDLE = { backgroundColor: "rgba(0,0,0,0)", borderColor: "rgba(241,239,233,.16)", color: "#B4B0A6" };
  const ACT = { backgroundColor: "#E2AE38", borderColor: "#E2AE38", color: "#1D2024" };
  const DONE = { backgroundColor: "rgba(226,174,56,.14)", borderColor: "rgba(226,174,56,.7)", color: "#F1EFE9" };
  const mode = (p, m, at, dur = 0.18) => {
    tl.to(p, { ...m, duration: dur, ease: "power2.out" }, at);
    const done = m === DONE;
    tl.to(p + " .ok", { opacity: done ? 1 : 0, scale: done ? 1 : 0.4, duration: 0.2, ease: "back.out(2)", transformOrigin: "50% 50%" }, at);
    tl.to(p + " .ic", { opacity: done ? 0 : 1, duration: 0.12 }, at);
  };

  // ---- state at t=0 == state at t=D: the finished poster ----
  pills.forEach((p) => { gsap.set(p, DONE); gsap.set(p + " .ok", { opacity: 1 }); gsap.set(p + " .ic", { opacity: 0 }); });
  gsap.set(".chip", { opacity: 0 });
  gsap.set("#chk", { strokeDashoffset: 0 });
  gsap.set("#link", { scaleY: 1 }); gsap.set("#r2s", { opacity: 1 });

  // drifting strata: yoyo over exactly D seconds, so the seam is invisible
  tl.fromTo(".s1", { x: -30, y: 8 }, { x: 30, y: -8, duration: D / 2, ease: "sine.inOut" }, 0)
    .to(".s1", { x: -30, y: 8, duration: D / 2, ease: "sine.inOut" }, D / 2);
  tl.fromTo(".s2", { x: 40, y: -6 }, { x: -40, y: 6, duration: D / 2, ease: "sine.inOut" }, 0)
    .to(".s2", { x: 40, y: -6, duration: D / 2, ease: "sine.inOut" }, D / 2);

  // ---- 0.6 reset: the report folds back into the ring ----
  const T0 = 0.6;
  tl.to(["#r3", "#r2", "#r1"], { opacity: 0, x: -14, duration: 0.14, stagger: 0.05, ease: "power2.in" }, T0);
  tl.to("#ttlw", { width: 0, duration: 0.2, ease: "power2.in" }, T0);
  tl.to(["#b2", "#b1"], { scaleX: 0, duration: 0.16, stagger: 0.04, ease: "power2.in" }, T0);
  tl.to("#link", { scaleY: 0, duration: 0.14 }, T0);
  tl.to("#card", { x: -110, scale: 0.35, opacity: 0, duration: 0.42, ease: "power3.in" }, T0 + 0.18);
  tl.to("#ul", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.3, ease: "power3.in" }, T0);
  tl.to("#chk", { strokeDashoffset: 1, duration: 0.28, ease: "power2.in" }, T0 + 0.25);
  pills.forEach((p, i) => mode(p, IDLE, T0 + 0.1 + i * 0.05));

  // ---- RECORD 1.0-3.0: events fly into the ring ----
  mode("#p1", ACT, 1.0);
  const CX = 770, CY = 300, chipC = [[1043, 170], [1043, 300], [1043, 430]];
  ["#c1", "#c2", "#c3"].forEach((c, i) => {
    const at = 1.1 + i * 0.4;
    tl.fromTo(c, { opacity: 0, x: 70, scale: 1, rotation: -4 }, { opacity: 1, x: 0, rotation: 0, duration: 0.2, ease: "power3.out" }, at);
    tl.to(c, { x: CX - chipC[i][0], y: CY - chipC[i][1], scale: 0.18, opacity: 0.0, duration: 0.42, ease: "power3.in" }, at + 0.3);
    tl.set(c, { x: 0, y: 0, scale: 1 }, at + 0.8);
    const hit = at + 0.72;
    tl.fromTo("#ring", { scale: 1.1 }, { scale: 1, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 50%" }, hit);
    tl.fromTo("#ringp", { rotation: 0 }, { rotation: 120, duration: 0.45, ease: "power2.out", svgOrigin: "28 31" }, hit);
    tl.fromTo("#glow", { scale: 1, opacity: 0.55 }, { scale: 1.3, opacity: 1, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, hit);
    tl.set("#ringp", { rotation: 0, svgOrigin: "28 31" }, hit + 0.45);
  });
  mode("#p1", DONE, 3.0);

  // ---- the check leaves through the seam; the report grows out of it ----
  tl.to("#chk", { strokeDashoffset: 0, duration: 0.32, ease: "power3.out" }, 2.95);
  tl.fromTo("#card", { x: -110, scale: 0.35, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)" }, 3.15);
  tl.fromTo("#r1", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 3.5);
  tl.fromTo("#r2", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 3.62);
  tl.fromTo("#r3", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 3.74);

  // ---- LINK 3.95-4.8: the failure is tied to the click that caused it ----
  mode("#p2", ACT, 3.95);
  tl.fromTo("#link", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.inOut" }, 4.05);
  tl.fromTo("#r2s", { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.2 }, 4.4);
  tl.fromTo("#r2", { scale: 1.04 }, { scale: 1, duration: 0.3, ease: "back.out(3)", transformOrigin: "50% 50%", immediateRender: false }, 4.4);
  mode("#p2", DONE, 4.8);

  // ---- WRITE 4.85-6.2: the report is written, then waits for the button ----
  mode("#p3", ACT, 4.85);
  tl.fromTo("#ttlw", { width: 0 }, { width: 352, duration: 0.45, ease: "power2.out" }, 4.9);
  tl.fromTo("#ul", { scaleX: 0 }, { scaleX: 1, transformOrigin: "0% 50%", duration: 0.4, ease: "power3.out" }, 4.9);
  tl.fromTo("#b1", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 5.1);
  tl.fromTo("#b2", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 5.3);
  tl.fromTo("#btn", { scale: 1 }, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut", transformOrigin: "50% 50%" }, 5.65);
  tl.fromTo("#sheen", { x: 0 }, { x: 640, duration: 0.7, ease: "power2.inOut" }, 5.6);
  mode("#p3", DONE, 5.95);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</body>
</html>
