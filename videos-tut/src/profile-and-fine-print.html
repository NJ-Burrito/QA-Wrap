  <style>

  <!-- S2: Settings > Sessions, the name field -->
  <div id="s2" class="scene">

      <div class="field abs" id="nfield" style="inset-inline-start:40px;top:262px;width:700px;height:80px;overflow:hidden">

  <!-- the avatar: one object from S2 to S6 (graphic match) -->

  </div>

      <div class="abs" style="inset-inline-start:34px;top:160px;display:flex;flex-direction:column;gap:22px"><i style="display:block;width:330px;height:14px;border-radius:7px;background:#DDD7CB"></i><i style="display:block;width:300px;height:14px;border-radius:7px;background:#DDD7CB"></i><i style="display:block;width:320px;height:14px;border-radius:7px;background:#DDD7CB"></i><i style="display:block;width:260px;height:14px;border-radius:7px;background:#DDD7CB"></i></div>
